<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学中文歌</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="songs-page">
    <main class="songs-container">
        <a href="index.html" class="back-link">← Quay lại</a>

        <header class="songs-header">
            <p class="songs-eyebrow">中文旋律 · Học qua âm nhạc</p>
            <h1>学中文歌</h1>
            <p>Chọn một chiếc đĩa để bắt đầu học.</p>
        </header>

        <section class="song-grid" id="songGrid" aria-label="Danh sách bài hát"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="songs-data.js"></script>
    <script>
        /* Danh sách tự dựng từ songs-data.js — thêm bài mới chỉ cần thêm vào file đó. */
        (function () {
            const grid = document.getElementById("songGrid");
            Object.keys(window.SONGS || {}).map(Number)
                .sort(function (a, b) { return a - b; })
                .forEach(function (n) {
                    const s = window.SONGS[n];
                    const a = document.createElement("a");
                    a.className = "song-card";
                    a.href = "song-lesson.html?id=" + n;
                    a.dataset.progressId = String(s.progressId || (1000 + n));
                    a.innerHTML =
                        '<span class="song-card-disc"><img alt=""><span class="song-card-hole"></span></span>' +
                        '<span class="song-card-info"><strong></strong><span></span><small></small>' +
                        '<em class="song-status" data-status="new">Chưa bắt đầu</em></span>' +
                        '<span class="song-card-play">▶</span>';
                    const im = a.querySelector("img");
                    im.src = s.cover;
                    im.alt = "Ảnh bìa " + s.titleZh;
                    a.querySelector("strong").textContent = s.titleZh + " · " + s.titleVi;
                    a.querySelector(".song-card-info > span").textContent = s.pinyin;
                    a.querySelector("small").textContent = s.artist;
                    grid.appendChild(a);
                });

            async function loadSongStatus() {
                if (!window.LessonProgress) return;
                const cards = Array.from(grid.querySelectorAll(".song-card[data-progress-id]"));
                const ids = cards.map(function (c) { return Number(c.dataset.progressId); })
                    .filter(Number.isFinite);
                if (!ids.length) return;
                let statuses = {};
                try { statuses = await window.LessonProgress.loadLessonStatuses(ids); } catch (e) { return; }
                const labels = { new: "Chưa bắt đầu", learning: "Đang học", completed: "Đã hoàn thành ✓" };
                cards.forEach(function (c) {
                    const st = statuses[Number(c.dataset.progressId)] || "new";
                    const b = c.querySelector(".song-status");
                    b.dataset.status = st;
                    b.textContent = labels[st];
                });
            }
            loadSongStatus();
        })();
    </script>
</body>

</html>
