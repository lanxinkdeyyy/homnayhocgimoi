<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Hôm Nay Học Gì?</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f3f8f4;
        }

        .auth-box {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #2f6f4e;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #6fa987;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #5f9f78;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4d8965;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #4d8965;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="auth-box">

    <h1>Chào mừng trở lại 🌿</h1>

    <div class="subtitle">
        Đăng nhập vào Hôm Nay Học Gì?
    </div>

    <form id="loginForm">

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Nhập email của bạn"
            required
        >

        <label for="password">Mật khẩu</label>
        <input
            type="password"
            id="password"
            placeholder="Nhập mật khẩu"
            required
        >

        <button type="submit">
            Đăng nhập
        </button>

    </form>

    <div id="message"></div>

    <div class="register-link">
        Chưa có tài khoản?
        <a href="register.html">Đăng ký</a>
    </div>

</div>

<script>
    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");

    loginForm.addEventListener("submit", async function (e) {

        e.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.textContent = "Đang đăng nhập...";

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            message.style.color = "red";
            message.textContent = "Đăng nhập thất bại: " + error.message;
            return;
        }

        message.style.color = "green";
        message.textContent = "Đăng nhập thành công!";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 800);
    });
</script>

</body>
</html>
